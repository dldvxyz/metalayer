# `bun lefthook install` to activate
# `bun lefthook uninstall` to deactivate

pre-commit:
  piped: true
  jobs:
    - name: Lint and format
      glob:
        - "*.ts"
        - "*.{json,jsonc}"
      run: bun run lint:fix {staged_files}
      stage-fixed: true

    - name: Typecheck
      run: bun run typecheck

    - name: Run tests
      run: bun run test

    - name: Build the package
      run: bun run build
