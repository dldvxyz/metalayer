# Hooks are installed automatically by `bun install`.
# `bun lefthook uninstall` to deactivate

pre-commit:
  piped: true
  jobs:
    - name: Lint and format
      glob:
        - "*.{ts,mts,cts,js,mjs,cjs}"
        - "*.{json,jsonc}"
        - "*.{yml,yaml}"
        - "*.md"
      run: bun run lint:fix {staged_files}
      stage_fixed: true

    - name: Typecheck
      run: bun run typecheck

    - name: Run tests
      run: bun run test

    - name: Build the package
      run: bun run build
